name: native build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release version without the v, e.g. 1.3.0 (tag becomes v1.3.0)'
        required: true
      publish:
        description: 'publish: create/refresh the release and upload the assets'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-cpp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: restore static qt
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: D:\qts
          key: qt-5.15-static-msvc-imder-v1

      - name: build static qt 5.15.2 (base)
        id: qtbuild
        if: steps.qtcache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone --depth 1 -b 5.15 https://github.com/qt/qtbase D:\src\qtbase
          curl -L -o D:\jom.zip https://download.qt.io/official_releases/jom/jom.zip || exit /b 1
          mkdir D:\jom && tar -xf D:\jom.zip -C D:\jom
          for /r D:\jom %%i in (jom.exe) do set "JOM=%%i"
          if not defined JOM exit /b 1
          echo using jom at %JOM%
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir D:\src\build && cd /d D:\src\build
          call ..\qtbase\configure.bat -static -static-runtime -release -opensource -confirm-license -prefix D:\qts -nomake examples -nomake tests -platform win32-msvc -opengl desktop -no-openssl -no-dbus || exit /b 1
          "%JOM%" -j4 || exit /b 1
          "%JOM%" -j4 install || exit /b 1

      - name: save static qt
        if: always() && steps.qtcache.outputs.cache-hit != 'true' && steps.qtbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: D:\qts
          key: qt-5.15-static-msvc-imder-v1

      - name: restore static opencv
        id: ocvcache
        uses: actions/cache/restore@v4
        with:
          path: |
            D:\src\ocvbuild
            D:\src\opencv
          key: opencv-4.10.0-static-msvc-imder-v1

      - name: build static opencv (core imgproc imgcodecs)
        id: ocvbuild
        if: steps.ocvcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Test-Path D:\src\opencv\CMakeLists.txt) { Write-Host "opencv source cached"; exit 0 }
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv D:\src\opencv
          cmake -S D:\src\opencv -B D:\src\ocvbuild -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_BUILD_TYPE=Release" "-DBUILD_SHARED_LIBS=OFF" `
            "-DBUILD_LIST=core,imgproc,imgcodecs" "-DBUILD_TESTS=OFF" "-DBUILD_PERF_TESTS=OFF" `
            "-DBUILD_EXAMPLES=OFF" "-DBUILD_opencv_apps=OFF" "-DBUILD_JPEG=ON" "-DBUILD_PNG=ON" `
            "-DBUILD_ZLIB=ON" "-DBUILD_WEBP=ON" "-DBUILD_TIFF=ON" "-DBUILD_OPENEXR=OFF" `
            "-DWITH_OPENCL=OFF" "-DWITH_IPP=OFF" "-DWITH_ITT=OFF" "-DWITH_TBB=OFF" `
            "-DWITH_FFMPEG=OFF" "-DWITH_GTK=OFF" "-DWITH_OPENEXR=OFF" "-DWITH_JASPER=OFF" "-DENABLE_LIBJPEG_TURBO_SIMD=OFF"
          cmake --build D:\src\ocvbuild --config Release -j 4

      - name: save static opencv
        if: always() && steps.ocvcache.outputs.cache-hit != 'true' && steps.ocvbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            D:\src\ocvbuild
            D:\src\opencv
          key: opencv-4.10.0-static-msvc-imder-v1

      - name: generate static plugin imports
        shell: pwsh
        run: |
          python scripts\gen_plugins.py D:\src\gen\imder_plugins.h D:\src\qtbase windows
          Copy-Item D:\src\gen\imder_plugins.h src\imder_plugins.h

      - name: build imder (single exe, /MT, WIN32)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DQt5_DIR="D:\qts\lib\cmake\Qt5" `
            -DOpenCV_DIR="D:\src\ocvbuild"
          cmake --build build --config Release -j 4

      - name: ffmpeg for the smoke
        shell: pwsh
        run: choco install ffmpeg -y --no-progress | Out-Null

      - name: smoke setup (ffmpeg inputs + real ffmpeg on PATH)
        timeout-minutes: 5
        shell: pwsh
        env:
          IMDER_NO_CONSOLE_ATTACH: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'chocolatey\\bin' } | Select-Object -First 1
          if ($real) { $env:PATH = "$($real.DirectoryName);$env:PATH"; Write-Host "real ffmpeg: $($real.FullName)" } else { Write-Host "no real ffmpeg dir found, using PATH" }
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=1" -frames:v 1 ta.png 2> $null
          ffmpeg -nostdin -y -f lavfi -i "smptebars=size=128x128:rate=1:duration=1" -frames:v 1 tb.png 2> $null
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=1" -frames:v 1 ta.jpg 2> $null
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=2" -c:v mpeg4 -q:v 2 -an tmpv.mp4 2> $null
          ffmpeg -nostdin -y -f lavfi -i "sine=frequency=440:duration=2" -c:a aac tmpa.m4a 2> $null
          ffmpeg -nostdin -y -i tmpv.mp4 -i tmpa.m4a -c copy -shortest tbv.mp4 2> $null
          if (-not (Test-Path ta.png)) { Write-Host "smoke setup FAILED"; exit 1 }
          if (-not (Test-Path ta.jpg)) { Write-Host "jpg smoke setup FAILED"; exit 1 }
          if (-not (Test-Path tbv.mp4)) { Write-Host "video smoke setup FAILED"; exit 1 }

      - name: smoke 1 - merge one-liner (png+gif+mp4)
        timeout-minutes: 6
        shell: pwsh
        env:
          IMDER_NO_CONSOLE_ATTACH: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $p = Start-Process -FilePath "build\Release\imder.exe" -ArgumentList @("ta.png","tb.png","results","--results","png","gif","mp4","--algo","merge","--res","128") -Wait -PassThru -NoNewWindow -RedirectStandardOutput sm1.out -RedirectStandardError sm1.err
          Write-Host "== exit code $($p.ExitCode)"
          Write-Host "== stdout:"; Get-Content sm1.out
          Write-Host "== stderr:"; Get-Content sm1.err
          if (-not (Test-Path "results\imder_*.png")) { Write-Host "image smoke FAILED"; exit 1 }
          if (-not (Test-Path "results\imder_*.gif")) { Write-Host "gif smoke FAILED"; exit 1 }
          if (-not (Test-Path "results\imder_*.mp4")) { Write-Host "video smoke FAILED"; exit 1 }
          Write-Host "smoke 1 OK"

      - name: smoke 2 - missform + jpg base
        timeout-minutes: 6
        shell: pwsh
        env:
          IMDER_NO_CONSOLE_ATTACH: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $p = Start-Process -FilePath "build\Release\imder.exe" -ArgumentList @("ta.jpg","tb.png","results","--results","mp4","--algo","missform","--res","128") -Wait -PassThru -NoNewWindow -RedirectStandardOutput sm2.out -RedirectStandardError sm2.err
          Write-Host "== exit code $($p.ExitCode)"
          Write-Host "== stdout:"; Get-Content sm2.out
          Write-Host "== stderr:"; Get-Content sm2.err
          if (-not (Test-Path "results\imder_*.mp4")) { Write-Host "missform/jpg smoke FAILED"; exit 1 }
          Write-Host "smoke 2 OK"

      - name: smoke 3 - generated sound + audio probe
        timeout-minutes: 6
        shell: pwsh
        env:
          IMDER_NO_CONSOLE_ATTACH: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'chocolatey\\bin' } | Select-Object -First 1
          if ($real) { $env:PATH = "$($real.DirectoryName);$env:PATH" }
          $p = Start-Process -FilePath "build\Release\imder.exe" -ArgumentList @("ta.png","tb.png","results","--results","mp4","--algo","merge","--res","128","--sound","gen") -Wait -PassThru -NoNewWindow -RedirectStandardOutput sm3.out -RedirectStandardError sm3.err
          Write-Host "== exit code $($p.ExitCode)"
          Write-Host "== stdout:"; Get-Content sm3.out
          Write-Host "== stderr:"; Get-Content sm3.err
          $vid = Get-ChildItem "results\imder_*.mp4" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $probe = & ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 $vid.FullName
          Write-Host "audio stream probe: $probe"
          if ("$probe" -notmatch "audio") { Write-Host "audio mux smoke FAILED"; exit 1 }
          Write-Host "smoke 3 OK"

      - name: smoke 4 - target sound at fixed sample rate (sq_hz)
        timeout-minutes: 6
        shell: pwsh
        env:
          IMDER_NO_CONSOLE_ATTACH: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'chocolatey\\bin' } | Select-Object -First 1
          if ($real) { $env:PATH = "$($real.DirectoryName);$env:PATH" }
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=2" -c:v mpeg4 -q:v 2 -an tmpv.mp4 2> $null
          ffmpeg -nostdin -y -f lavfi -i "sine=frequency=440:duration=2" -c:a aac tmpa.m4a 2> $null
          ffmpeg -nostdin -y -i tmpv.mp4 -i tmpa.m4a -c copy -shortest tbv.mp4 2> $null
          $p = Start-Process -FilePath "build\Release\imder.exe" -ArgumentList @("ta.png","tbv.mp4","results","--results","mp4","--algo","merge","--res","128","--sound","target","--sq_hz","16000") -Wait -PassThru -NoNewWindow -RedirectStandardOutput sm4.out -RedirectStandardError sm4.err
          Write-Host "== exit code $($p.ExitCode)"
          Write-Host "== stdout:"; Get-Content sm4.out
          Write-Host "== stderr:"; Get-Content sm4.err
          $vid = Get-ChildItem "results\imder_*.mp4" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $probe = & ffprobe -v error -select_streams a:0 -show_entries stream=codec_type,sample_rate -of csv=p=0 $vid.FullName
          Write-Host "audio stream probe: $probe"
          if ("$probe" -notmatch "audio") { Write-Host "sq_hz smoke FAILED"; exit 1 }
          Write-Host "smoke 4 OK"

      - name: exe size
        shell: pwsh
        run: Get-Item "build\Release\imder.exe" | Select-Object Name,Length

      - name: dump smoke output on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in ((Get-ChildItem "sm*.out" -ErrorAction SilentlyContinue) + (Get-ChildItem "sm*.err" -ErrorAction SilentlyContinue))) {
            Write-Host "== $($f.Name)"
            Get-Content $f.FullName
          }
          if (Test-Path results) { Write-Host "== results dir:"; Get-ChildItem results | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" } }

      - name: collect portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\imder | Out-Null
          Copy-Item build\Release\imder.exe dist\imder\
          Copy-Item packaging\windows\cli.bat dist\imder\
          Compress-Archive -Path dist\imder -DestinationPath "IMDER_windows_v${{ inputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: imder-windows-cpp
          path: IMDER_windows_v${{ inputs.version }}.zip

  linux-cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libglib2.0-dev ninja-build \
            libunwind-dev xvfb ffmpeg

      - name: restore static qt
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: /opt/qts
          key: qt-5.15-static-linux-imder-v1

      - name: build static qt 5.15.2 (base)
        id: qtbuild
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b 5.15 https://github.com/qt/qtbase /opt/src/qtbase
          mkdir -p /opt/src/build && cd /opt/src/build
          ../qtbase/configure -static -release -opensource -confirm-license \
            -prefix /opt/qts -nomake examples -nomake tests -nomake tools \
            -xcb -opengl desktop -no-openssl -no-dbus
          make -j"$(nproc)"
          make install

      - name: save static qt
        if: always() && steps.qtcache.outputs.cache-hit != 'true' && steps.qtbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /opt/qts
          key: qt-5.15-static-linux-imder-v1

      - name: restore static opencv
        id: ocvcache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/src/ocvbuild
            /opt/src/opencv
          key: opencv-4.10.0-static-linux-imder-v1

      - name: build static opencv
        id: ocvbuild
        if: steps.ocvcache.outputs.cache-hit != 'true'
        run: |
          if [ -f /opt/src/opencv/CMakeLists.txt ]; then echo "opencv source cached"; exit 0; fi
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv /opt/src/opencv
          cmake -S /opt/src/opencv -B /opt/src/ocvbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc,imgcodecs -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF -DBUILD_JPEG=ON -DBUILD_PNG=ON \
            -DBUILD_ZLIB=ON -DBUILD_WEBP=ON -DBUILD_TIFF=ON -DBUILD_OPENEXR=OFF \
            -DBUILD_JPEG2000=OFF -DWITH_OPENCL=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_TBB=OFF \
            -DWITH_FFMPEG=OFF -DWITH_GTK=OFF -DWITH_OPENEXR=OFF -DWITH_JASPER=OFF -DENABLE_LIBJPEG_TURBO_SIMD=OFF
          cmake --build /opt/src/ocvbuild -j "$(nproc)"

      - name: save static opencv
        if: always() && steps.ocvcache.outputs.cache-hit != 'true' && steps.ocvbuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/src/ocvbuild
            /opt/src/opencv
          key: opencv-4.10.0-static-linux-imder-v1

      - name: generate static plugin imports
        run: |
          python3 scripts/gen_plugins.py /opt/src/gen/imder_plugins.h /opt/src/qtbase linux
          cp /opt/src/gen/imder_plugins.h src/imder_plugins.h

      - name: build imder
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQt5_DIR=/opt/qts/lib/cmake/Qt5 -DOpenCV_DIR=/opt/src/ocvbuild
          cmake --build build -j "$(nproc)"

      - name: smoke test (the real binary, cli one-liners + jpg + gif + mp4 + sound)
        timeout-minutes: 20
        run: |
          command -v ffmpeg ffprobe || { echo "no ffmpeg on runner"; exit 1; }
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=1" -frames:v 1 ta.png 2>/dev/null
          ffmpeg -nostdin -y -f lavfi -i "smptebars=size=128x128:rate=1:duration=1" -frames:v 1 tb.png 2>/dev/null
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=1" -frames:v 1 ta.jpg 2>/dev/null
          ffmpeg -nostdin -y -f lavfi -i "testsrc=size=128x128:rate=1:duration=2" -c:v mpeg4 -q:v 2 -an tmpv.mp4 2>/dev/null
          ffmpeg -nostdin -y -f lavfi -i "sine=frequency=440:duration=2" -c:a aac tmpa.m4a 2>/dev/null
          ffmpeg -nostdin -y -i tmpv.mp4 -i tmpa.m4a -c copy -shortest tbv.mp4 2>/dev/null
          [ -f ta.png ] || { echo "smoke setup FAILED"; exit 1; }
          [ -f ta.jpg ] || { echo "jpg smoke setup FAILED"; exit 1; }
          [ -f tbv.mp4 ] || { echo "video smoke setup FAILED"; exit 1; }
          echo "== [1] merge one-liner (png+gif+mp4)"
          ./build/imder ta.png tb.png results --results png gif mp4 --algo merge --res 128
          ls results/imder_*.png > /dev/null || { echo "image smoke FAILED"; exit 1; }
          ls results/imder_*.gif > /dev/null || { echo "gif smoke FAILED"; exit 1; }
          ls results/imder_*.mp4 > /dev/null || { echo "video smoke FAILED"; exit 1; }
          echo "== [2] missform with jpg base"
          ./build/imder ta.jpg tb.png results --results mp4 --algo missform --res 128
          echo "== [3] generated sound"
          ./build/imder ta.png tb.png results --results mp4 --algo merge --res 128 --sound gen
          vid=$(ls -t results/imder_*.mp4 | head -1)
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$vid" | grep -q audio || { echo "audio mux smoke FAILED"; exit 1; }
          echo "== [4] target sound at fixed sample rate (sq_hz)"
          ./build/imder ta.png tbv.mp4 results --results mp4 --algo merge --res 128 --sound target --sq_hz 16000
          vid=$(ls -t results/imder_*.mp4 | head -1)
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type,sample_rate -of csv=p=0 "$vid" | grep -q audio || { echo "sq_hz smoke FAILED"; exit 1; }
          echo "== exe size:"
          ls -la build/imder
          echo "smoke OK"

      - name: gui startup smoke (xvfb, 8s alive)
        timeout-minutes: 5
        run: |
          code=0
          timeout 8 xvfb-run -a ./build/imder || code=$?
          if [ $code -ne 124 ] && [ $code -ne 0 ]; then echo "gui startup smoke FAILED (exit $code)"; exit 1; fi
          echo "gui startup OK"

      - name: collect portable bundle
        run: |
          mkdir -p dist/imder
          cp build/imder dist/imder/
          cp packaging/linux/cli.sh dist/imder/
          cp packaging/linux/install.sh dist/imder/
          chmod +x dist/imder/imder dist/imder/cli.sh dist/imder/install.sh
          (cd dist && zip -qr ../"imder_linux_v${{ inputs.version }}_cpp.zip" imder)

      - uses: actions/upload-artifact@v4
        with:
          name: imder-linux-cpp
          path: imder_linux_v${{ inputs.version }}_cpp.zip

  release:
    needs: [windows-cpp, linux-cpp]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: pkgs

      - name: publish release v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          NOTES=$(mktemp)
          awk '/^## \[v${{ inputs.version }}\]/{f=1;next} f&&/^## \[/{exit} f' changelog.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then echo "IMDER v${{ inputs.version }}" > "$NOTES"; fi
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "IMDER v${{ inputs.version }}" --notes-file "$NOTES"
          gh release upload "$TAG" \
            "pkgs/imder-windows-cpp/IMDER_windows_v${{ inputs.version }}.zip" \
            "pkgs/imder-linux-cpp/imder_linux_v${{ inputs.version }}_cpp.zip" \
            --clobber
          echo "assets on $TAG:"
          gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[] | \"\(.name) \(.size)\""
